name: Status pages to Slack

on:
  schedule:
    - cron: '17 * * * *'    # hourly backup; the Cloudflare Worker in cloudflare-worker/ starts it every 5 min
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      service:
        description: 'Which service to run'
        type: choice
        options: [all, cloudflare, smtp2go, aws, oci, slack, salesforce, dynatrace, jira, microsoft]
        default: all
      test_post:
        description: 'Also post the latest incident update, to preview the format'
        type: boolean
        default: false
      deploy_page:
        description: 'Also redeploy the status page site (needed after changing site/index.html)'
        type: boolean
        default: false
  push:                      # redeploy the status page when its design changes
    branches: [main]
    paths: ['site/**']

permissions:
  contents: read
  actions: write             # lets the keep-alive step re-enable this workflow

concurrency:
  group: status-to-slack
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false       # one status page being down doesn't stop the others
      matrix:
        # To add a service: add services/<id>.json, a line here (and to the options above),
        # and a repository secret with the Slack webhook for its channel.
        # prefix = start of the optional Actions variable names, e.g. CF_CATEGORIES
        include:
          - { id: cloudflare, prefix: CF,      secret: SLACK_WEBHOOK_URL_CLOUDFLARE }
          - { id: smtp2go,    prefix: SMTP2GO, secret: SLACK_WEBHOOK_URL_SMTP2GO }
          - { id: aws,        prefix: AWS,     secret: SLACK_WEBHOOK_URL_AWS }
          - { id: oci,        prefix: OCI,     secret: SLACK_WEBHOOK_URL_OCI }
          - { id: slack,      prefix: SLACK,   secret: SLACK_WEBHOOK_URL_SLACK }
          - { id: salesforce, prefix: SF,      secret: SLACK_WEBHOOK_URL_SALESFORCE }
          - { id: dynatrace,  prefix: DT,      secret: SLACK_WEBHOOK_URL_DYNATRACE }
          - { id: jira,       prefix: JIRA,    secret: SLACK_WEBHOOK_URL_JIRA }
          - { id: microsoft,  prefix: MS,      secret: SLACK_WEBHOOK_URL_MICROSOFT }
    # A manual run for one service skips the other services' steps
    env:
      SELECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.id }}
    steps:
      - uses: actions/checkout@v6
        if: env.SELECTED == 'true'

      # The state file lives in the Actions cache, not the repo. Each run restores the
      # newest one and saves a new copy; caches unused for 7 days are dropped by GitHub,
      # after which the script just takes a fresh baseline.
      - name: Restore state
        if: env.SELECTED == 'true'
        uses: actions/cache/restore@v5
        with:
          path: state/${{ matrix.id }}.json
          key: state-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: state-${{ matrix.id }}-

      - name: Poll ${{ matrix.id }} and post changes
        if: env.SELECTED == 'true'
        shell: pwsh
        env:
          SLACK_WEBHOOK_URL: ${{ secrets[matrix.secret] }}
          # Optional overrides of services/<id>.json, set under
          # Settings -> Secrets and variables -> Actions -> Variables, e.g. AWS_CATEGORIES
          CATEGORIES: ${{ vars[format('{0}_CATEGORIES', matrix.prefix)] }}
          MIN_IMPACT: ${{ vars[format('{0}_MIN_IMPACT', matrix.prefix)] }}
          SKIP_UNTAGGED: ${{ vars[format('{0}_SKIP_UNTAGGED', matrix.prefix)] }}
          SKIP_OVERALL_STATUS: ${{ vars[format('{0}_SKIP_OVERALL_STATUS', matrix.prefix)] }}
          SLACK_LABEL: ${{ vars[format('{0}_SLACK_LABEL', matrix.prefix)] }}
        run: |
          if (-not $env:SLACK_WEBHOOK_URL) {
            # still checked for the status page, just not posted to Slack
            Write-Host "::warning::No ${{ matrix.secret }} secret yet, so ${{ matrix.id }} isn't posted to Slack"
            ./status-to-slack.ps1 -Service ${{ matrix.id }} -DryRun
            exit 0
          }
          ./status-to-slack.ps1 -Service ${{ matrix.id }} ${{ inputs.test_post && '-TestPost' || '' }}

      - name: Save state
        if: env.SELECTED == 'true'
        uses: actions/cache/save@v5
        with:
          path: state/${{ matrix.id }}.json
          key: state-${{ matrix.id }}-${{ github.run_id }}

      # This service's current status, for the status page (publish job below)
      - name: Upload status snapshot
        if: env.SELECTED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-${{ matrix.id }}
          path: status/${{ matrix.id }}.json
          if-no-files-found: ignore
          retention-days: 1

      # GitHub disables scheduled workflows in public repos after 60 days without commits, and a
      # disabled workflow can't be started by the Worker either. Re-enabling it during the
      # 00:00 UTC hour each day resets that timer.
      - name: Keep schedule alive
        if: matrix.id == 'cloudflare' && env.SELECTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh workflow enable status-to-slack.yml --repo "$GITHUB_REPOSITORY"
          fi

  # Status page data: combines the snapshots from the jobs above with the previous status.json
  # (for services that weren't checked in this run) and saves it to the "status-data" branch,
  # which the page reads. That's a quick git push, unlike a GitHub Pages deployment, which can
  # take several minutes and doesn't keep up with a run every 5 minutes.
  publish:
    needs: poll
    if: always()             # publish what we have even if one status page failed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write        # push the status-data branch
    steps:
      - uses: actions/checkout@v6

      - name: Download status snapshots
        uses: actions/download-artifact@v7
        with:
          pattern: snapshot-*
          path: status
          merge-multiple: true

      - name: Get the previous status
        run: |
          if git fetch --depth=1 origin status-data; then
            git show FETCH_HEAD:status.json > previous-status.json
          else
            echo "No status-data branch yet; starting fresh"
          fi

      - name: Build status page
        shell: pwsh
        env:
          # A check-mark reaction on a Slack post marks that incident acknowledged on the page.
          # Bot token of the Slack app that reads the channels (see README); optional.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ACK_EMOJI: ${{ vars.ACK_EMOJI }}   # optional, e.g. "white_check_mark,eyes"
        run: |
          $previous = if (Test-Path previous-status.json) { 'previous-status.json' } else { '' }
          ./build-status-page.ps1 -SnapshotDir status -OutDir _site -PreviousFile $previous -Trigger "${{ github.event_name }}" -RunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # The branch holds just status.json in a single commit, replaced on every run, so it
      # doesn't pile up history.
      - name: Save status to the status-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir data && cp _site/status.json data/ && cd data
          git init -q -b status-data
          git add status.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Status at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status-data

      # The site itself (index.html) only needs deploying when it changes: on a push to site/,
      # on a manual run with "deploy_page", and hourly from GitHub's schedule as a backup.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.deploy_page
        with:
          path: _site
          include-hidden-files: true   # keep .nojekyll

  # Needs Settings -> Pages -> Source: "GitHub Actions".
  deploy-site:
    needs: publish
    if: always() && needs.publish.result == 'success' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.deploy_page)
    runs-on: ubuntu-24.04
    timeout-minutes: 10      # longer than the deploy timeout below, so a stuck deploy can cancel itself
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          # Give up on a deployment that hangs after 4 min. The action then cancels it, so the
          # next deploy isn't blocked behind it ("in progress deployment"). Must stay below the
          # job's timeout-minutes, or the job is killed before it can cancel.
          timeout: 240000
