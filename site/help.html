<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Each Check Covers</title>
<!-- The full description behind each (?) icon on the status page (index.html). The text comes
     from "about" and "details" in each services\<id>.json, through status.json. -->
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6675; --line: #e3e6ec;
    --none: #2eb67d; --minor: #d9a21b; --major: #e8711c; --critical: #e01e5a; --maintenance: #1d9bd1; --stale: #9aa1ad;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1b1f27; --text: #e7e9ee; --muted: #9aa3b2; --line: #2a303b;
      --minor: #ecb22e; --major: #f38020;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --card: #1b1f27; --text: #e7e9ee; --muted: #9aa3b2; --line: #2a303b;
    --minor: #ecb22e; --major: #f38020;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 16px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  a { color: inherit; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 14px; }
  .back { display: inline-block; margin-top: 8px; font-size: 14px; font-weight: 600; }
  .contents { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 0 0 24px; }
  .contents a {
    font-size: 13px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); text-decoration: none;
  }
  .contents a:hover { border-color: var(--maintenance); }
  h2.section { font-size: 20px; margin: 28px 0 10px; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
  h3.subsection { font-size: 15px; color: var(--muted); margin: 16px 0 8px; }
  article {
    --accent: var(--none);
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 10px;
  }
  article:target { outline: 2px solid var(--maintenance); outline-offset: 2px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .head h4 { font-size: 17px; margin: 0; }
  .purpose { color: var(--muted); font-weight: 500; }
  .state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .summary { font-weight: 600; margin: 6px 0 4px; }
  .details { margin: 0 0 8px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  code { font: 13px ui-monospace, Consolas, monospace; }
  @media (max-width: 520px) { dl { grid-template-columns: 1fr; } dt { margin-top: 4px; } }
  .error { text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>What Each Check Covers</h1>
    <div class="meta">What every tile on the status page watches, and what an outage there means for CMiC.</div>
    <a class="back" href="./">&larr; Back to the status page</a>
  </header>
  <nav id="contents" class="contents" aria-label="Sections"></nav>
  <div id="list"></div>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('theme') === 'light' || params.get('theme') === 'dark') document.documentElement.dataset.theme = params.get('theme');
  const LABELS = { none: 'Operational', maintenance: 'Maintenance', minor: 'Minor issue', major: 'Major issue', critical: 'Critical' };

  const el = (tag, props = {}, ...children) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v; else n[k] = v;
    }
    for (const c of children) if (c != null) n.append(c);
    return n;
  };
  const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
  const link = (text, url) => { const u = safeUrl(url); return u ? el('a', { href: u, target: '_blank', rel: 'noopener', textContent: text }) : el('span', { textContent: text }); };
  const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  // same data as the status page: the repo's "status-data" branch on GitHub Pages, else the
  // status.json next to this page
  function dataUrls() {
    const urls = [];
    const m = location.hostname.match(/^([^.]+)\.github\.io$/);
    const repo = location.pathname.split('/').filter(Boolean)[0];
    if (m && repo) urls.push(`https://raw.githubusercontent.com/${m[1]}/${repo}/status-data/status.json`);
    urls.push('status.json');
    return urls;
  }
  async function fetchStatus() {
    let lastError;
    for (const url of dataUrls()) {
      try {
        const res = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) return await res.json();
        lastError = new Error(`${url}: HTTP ${res.status}`);
      } catch (e) { lastError = e; }
    }
    throw lastError;
  }

  function entry(s) {
    const h = s.help || {};
    const level = LABELS[s.level] ? s.level : 'none';
    const a = el('article', { id: s.id, style: `--accent: var(--${level})` });
    a.append(el('div', { class: 'head' },
      el('h4', {}, s.name, s.purpose ? el('span', { class: 'purpose', textContent: ` · ${s.purpose}` }) : null),
      el('span', { class: 'state' }, el('span', { class: 'dot' }), `Now: ${LABELS[level]}`)));
    if (h.summary) a.append(el('p', { class: 'summary', textContent: h.summary }));
    if (h.details && !(h.summary || '').includes(h.details)) a.append(el('p', { class: 'details', textContent: h.details }));

    const dl = el('dl');
    const row = (k, ...v) => dl.append(el('dt', { textContent: k }), el('dd', {}, ...v));
    if (h.statusPage) row('Vendor status page', link(h.statusPage.replace(/^https?:\/\//, ''), h.statusPage));
    if (h.watches && h.watches.length) row('Only watches', h.watches.join(', '));
    for (const e of h.endpoints || []) {
      const u = safeUrl(e.url), code = el('code', { textContent: e.url });
      row(e.name || 'Endpoint', u ? el('a', { href: u, target: '_blank', rel: 'noopener' }, code) : code);
    }
    if (h.check) row('Check', h.check === 'ws-ping' ? 'ws-ping: must answer {"ping":"pong"}, no login'
                              : h.check === 'login page' ? 'Login page: must answer HTTP 401, no login is sent' : h.check);
    if (h.endpoints && h.endpoints.length) row('Counts as down', 'Two failed checks in a row (5 minutes apart)');
    row('Posts to #hostingsupport', h.slack === false ? 'No, page only' : 'Yes');
    a.append(dl);
    return a;
  }

  (async () => {
    const list = document.getElementById('list');
    let data;
    try { data = await fetchStatus(); }
    catch { list.append(el('p', { class: 'error', textContent: "Couldn't load the descriptions right now. Try refreshing in a minute." })); return; }
    const services = data.services || [];
    // sections and subsections in the status page's order
    const order = (s) => [s.groupOrder ?? 99, s.group || '', s.subgroupOrder ?? 99, s.subgroup || '', s.name || ''];
    services.sort((x, y) => { const a = order(x), b = order(y); for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return 0; });
    const nav = document.getElementById('contents');
    let group = null, sub = null;
    for (const s of services) {
      if (s.group !== group) {
        group = s.group; sub = null;
        list.append(el('h2', { class: 'section', id: `section-${slug(group || 'other')}`, textContent: group }));
        nav.append(el('a', { href: `#section-${slug(group || 'other')}`, textContent: group }));
      }
      if ((s.subgroup || '') !== (sub || '')) { sub = s.subgroup; if (sub) list.append(el('h3', { class: 'subsection', textContent: sub })); }
      list.append(entry(s));
    }
    // the page was built after load, so jump to the clicked service now
    if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
  })();
})();
</script>
</body>
</html>
